name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The magma seam is this tool's reason to exist and had NEVER been executed against real
      # magma in any test — every fixture was written from our own belief about the contract, so
      # the tests agreed with the bugs. The integration test does not skip when magma is absent:
      # a test that silently skips is indistinguishable from one that ran and passed. Installing it
      # here is what makes that test real rather than decorative.
      - name: install magma (the real producer this tool consumes)
        run: go install github.com/robot-accomplice/magma@v0.2.0

      - name: test (race) + coverage
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: coverage gate (>=80%)
        run: |
          pct="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          echo "total coverage: ${pct}%  (minimum: 80%)"
          awk "BEGIN { exit !(${pct} >= 80) }" || {
            echo "::error::coverage ${pct}% is below the 80% gate"; exit 1; }

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  # The skill is prose, and prose is what this tool audits other repos for. A deployed skill that is
  # missing its lexicon produces a sweep with no vocabulary — indistinguishable from a real one, and
  # not one. The binary no longer carries a copy, so the gate is that the CHECKOUT deploys cleanly.
  skill:
    name: skill tree deploys cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install from the checkout and doctor it
        run: |
          export HOME="$(mktemp -d)"
          go run ./cmd/ferret install --from .
          go run ./cmd/ferret doctor --from .
