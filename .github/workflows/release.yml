name: Release

# The captured release procedure: pushing a semver tag (e.g. v0.1.0) re-runs the CI gates, verifies
# the tag matches the binary's reported version AND the embedded skill's stamp, cross-compiles every
# target from one runner (pure Go), and publishes a GitHub Release with checksummed archives.
#
# Publishing semver tags is what makes pinning POSSIBLE. `@latest` is a legitimate install path and
# stays supported; a pinned tag resolves to a fixed, reviewable commit, which is what we prefer for
# things we depend on and what others tend to prefer too. This workflow exists so that choice is
# available rather than to remove one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }} # attacker-controllable in theory: only ever used quoted, via env
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Re-run CI gates
        run: |
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "not gofmt-clean:"; echo "$unformatted"; exit 1; }
          go vet ./...
          go test ./... -covermode=atomic -coverprofile=coverage.out
          pct="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          echo "coverage ${pct}%"
          awk "BEGIN { exit !(${pct} >= 80) }" || { echo "coverage below 80% gate"; exit 1; }

      - name: Verify tag matches binary version
        run: |
          want="${TAG#v}"
          got="$(go run ./cmd/ferret --version | awk '{print $2}')"
          echo "tag=${want} binary=${got}"
          [ "$want" = "$got" ] || {
            echo "::error::tag ${TAG} does not match binary version ${got} (update binVersion)"
            exit 1; }

      # The skill version is DATE-STYLE (YYYY-MM-DD.N) and stays that way: it labels prose that
      # moves on its own cadence, so tying it to the binary's semver would misdescribe what it
      # names. An earlier version of this step overwrote it with the tag, which would have
      # silently changed the format of every recorded lexicon version.
      #
      # This gate does not mutate the stamp; it checks the stamp was bumped when the prose was.
      # A version string cannot detect an edit that did not bump it -- which is precisely how two
      # copies of the lexicon once drifted while both still declared the same version.
      - name: Verify the skill stamp is date-style and was bumped if skill/ changed
        run: |
          stamp="$(jq -r .version skill/VERSION)"
          echo "skill stamp: ${stamp}"
          echo "$stamp" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$' || {
            echo "::error::skill stamp ${stamp} is not date-style YYYY-MM-DD.N"; exit 1; }
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            if ! git diff --quiet "$prev" "$TAG" -- skill/; then
              old="$(git show "$prev:skill/VERSION" | jq -r .version)"
              echo "skill/ changed since ${prev} (stamp then: ${old})"
              [ "$old" != "$stamp" ] || {
                echo "::error::skill/ changed since ${prev} but the stamp is still ${stamp}"
                exit 1; }
            fi
          fi

      - name: Cross-compile release archives
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          # NO WINDOWS. `install` creates symlinks (internal/install: os.Symlink), which needs
          # privilege or developer mode on Windows, and no Windows path in this tool has ever been
          # executed -- CI is ubuntu-latest at every job and there is not one runtime.GOOS branch in
          # the source. The first review accepted this risk ONLY on the stated ground that the
          # honest remedy was to stop publishing the binary; it kept being published, so that
          # deferral's own justification had lapsed. Shipping a binary nobody has run is the failure
          # class this project exists to find, and shipping it from this project is worse.
          #
          # Restore windows/amd64 when a Windows job runs the suite and `install` has a tested path.
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            bin="ferret"; [ "$os" = "windows" ] && bin="ferret.exe"
            echo "==> ${os}/${arch}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "dist/${bin}" ./cmd/ferret
            # Assets are named after the PROJECT, not the binary inside them. The repo is slop-ferret and
            # the binary is ferret; downstream release-sync keys on the project name, which is the
            # house convention across the sibling projects (magma_<tag>_<os>_<arch>).
            base="slop-ferret_${TAG}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd dist && zip -q "${base}.zip" "$bin" && rm "$bin")
            else
              (cd dist && tar -czf "${base}.tar.gz" "$bin" && rm "$bin")
            fi
          done
          # The skill ships as its own artifact: a checksummed, versioned acquisition path for
          # anyone who wants one. SUPPORTED, not required — `ferret install` resolves the tag from
          # the repository and does not depend on this artifact existing (D8).
          tar -czf "dist/slop-ferret-skill_${TAG}.tar.gz" skill
          (cd dist && sha256sum ./* > checksums.txt)
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
